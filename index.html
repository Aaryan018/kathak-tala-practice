<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NrityaSADAN — Kathak Tala Practice</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
<style>
  :root {
    --bg: #0f0f14;
    --surface: #1a1a24;
    --border: #2a2a3a;
    --text: #e0dce4;
    --dim: #7a7590;
    --accent: #f0a060;
    --tali: #4ec9b0;
    --khali: #c586c0;
    --active: #f0a060;
    --danger: #e0556a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }
  header {
    text-align: center;
    margin-bottom: 2rem;
  }
  header h1 {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--accent), var(--tali));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header p {
    color: var(--dim);
    font-size: 0.9rem;
    margin-top: 0.3rem;
  }

  .container {
    max-width: 720px;
    width: 100%;
  }

  /* Tala selector */
  .tala-selector {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
    justify-content: center;
  }
  .tala-btn {
    padding: 0.6rem 1.2rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 500;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .tala-btn:hover { border-color: var(--accent); color: var(--accent); }
  .tala-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }

  /* Controls */
  .controls {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }
  .control-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .tempo-group {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex: 1;
    min-width: 200px;
  }
  .tempo-group label {
    color: var(--dim);
    font-size: 0.85rem;
    font-weight: 500;
    white-space: nowrap;
  }
  .tempo-slider {
    flex: 1;
    -webkit-appearance: none;
    height: 6px;
    border-radius: 3px;
    background: var(--border);
    outline: none;
  }
  .tempo-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }
  .tempo-value {
    font-weight: 700;
    font-size: 1.2rem;
    min-width: 3rem;
    text-align: right;
    color: var(--accent);
  }

  .btn-row {
    display: flex;
    gap: 0.75rem;
    margin-top: 1rem;
  }
  .btn {
    padding: 0.7rem 1.8rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
    transition: all 0.15s;
  }
  .btn-play {
    background: var(--tali);
    color: var(--bg);
  }
  .btn-play:hover { filter: brightness(1.1); }
  .btn-stop {
    background: var(--danger);
    color: #fff;
  }
  .btn-stop:hover { filter: brightness(1.1); }
  .btn-stop:disabled { opacity: 0.4; cursor: default; }

  /* Theka Grid */
  .theka-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
  }
  .theka-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .theka-name {
    font-size: 1.2rem;
    font-weight: 700;
  }
  .matra-count {
    color: var(--dim);
    font-size: 0.85rem;
  }
  .legend {
    display: flex;
    gap: 1rem;
    font-size: 0.8rem;
    color: var(--dim);
  }
  .legend span { display: flex; align-items: center; gap: 0.3rem; }
  .legend-dot {
    width: 10px; height: 10px; border-radius: 3px;
  }
  .legend-tali { background: var(--tali); }
  .legend-khali { background: var(--khali); }
  .legend-sam { background: var(--accent); }

  .theka-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    margin-bottom: 1rem;
  }
  .vibhag-group {
    display: flex;
    gap: 3px;
    position: relative;
  }
  .vibhag-group:not(:last-child)::after {
    content: '';
    width: 2px;
    background: var(--border);
    margin-left: 6px;
    border-radius: 1px;
  }
  .beat-cell {
    width: 52px;
    height: 64px;
    border-radius: 6px;
    background: var(--bg);
    border: 2px solid transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 600;
    transition: all 0.08s;
    position: relative;
    user-select: none;
  }
  .beat-cell .bol { font-size: 0.75rem; line-height: 1; }
  .beat-cell .sub-bol { font-size: 0.6rem; color: var(--dim); line-height: 1; }
  .beat-cell.tali-start { border-color: var(--tali); }
  .beat-cell.khali-start { border-color: var(--khali); }
  .beat-cell.sam { border-color: var(--accent); }
  .beat-cell.active {
    background: var(--accent);
    color: var(--bg);
    transform: scale(1.08);
    box-shadow: 0 0 16px rgba(240, 160, 96, 0.3);
  }
  .beat-cell.active .sub-bol { color: rgba(15, 15, 20, 0.6); }
  .beat-marker {
    position: absolute;
    top: -8px;
    font-size: 0.55rem;
    padding: 1px 4px;
    border-radius: 3px;
    font-weight: 700;
  }
  .tali-start .beat-marker { background: var(--tali); color: var(--bg); }
  .khali-start .beat-marker { background: var(--khali); color: var(--bg); }
  .sam .beat-marker { background: var(--accent); color: var(--bg); }

  .cycle-counter {
    text-align: center;
    color: var(--dim);
    font-size: 0.8rem;
    margin-top: 0.5rem;
  }

  @media (max-width: 600px) {
    body { padding: 1rem 0.5rem; }
    .beat-cell { width: 42px; height: 56px; }
    .beat-cell .bol { font-size: 0.7rem; }
    .beat-cell .sub-bol { font-size: 0.55rem; }
    .controls { padding: 1rem; }
    .tala-btn { padding: 0.5rem 0.8rem; font-size: 0.8rem; }
  }
</style>
</head>
<body>
<header>
  <h1>NrityaSADAN</h1>
  <p>Kathak Tala Practice Tool</p>
</header>

<div class="container">
  <div class="tala-selector" id="talaSelector"></div>

  <div class="controls">
    <div class="control-row">
      <div class="tempo-group">
        <label>🎚 Tempo</label>
        <input type="range" class="tempo-slider" id="tempoSlider" min="40" max="240" value="120">
        <span class="tempo-value" id="tempoValue">120</span>
        <label>BPM</label>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-play" id="btnPlay">▶ Play</button>
      <button class="btn btn-stop" id="btnStop" disabled>■ Stop</button>
    </div>
  </div>

  <div class="theka-section">
    <div class="theka-info">
      <div>
        <span class="theka-name" id="thekaName">Teental</span>
        <span class="matra-count" id="matraCount"> · 16 matras</span>
      </div>
      <div class="legend">
        <span><span class="legend-dot legend-sam"></span> Sam (1)</span>
        <span><span class="legend-dot legend-tali"></span> Tali</span>
        <span><span class="legend-dot legend-khali"></span> Khali</span>
      </div>
    </div>
    <div class="theka-grid" id="thekaGrid"></div>
    <div class="cycle-counter" id="cycleCounter">Ready — press Play</div>
  </div>
</div>

<script>
// ── Tala definitions ──────────────────────────────────
const TALAS = {
  teental: {
    name: 'Teental',
    matras: 16,
    vibhags: [4, 4, 4, 4],
    tali: [0, 1, 3],
    khali: [2],
    theka: [
      ['Dha'], ['Dhin'], ['Dhin'], ['Dha'],
      ['Dha'], ['Dhin'], ['Dhin'], ['Dha'],
      ['Dha'], ['Tin'], ['Tin'], ['Ta'],
      ['Ta'],  ['Dhin'], ['Dhin'], ['Dha'],
    ]
  },
  ektaal: {
    name: 'Ektaal',
    matras: 12,
    vibhags: [2, 2, 2, 2, 2, 2],
    tali: [0, 2, 4, 5],
    khali: [1, 3],
    theka: [
      ['Dhin'], ['Dhin'],
      ['Dha','Ge'], ['Ti','Ra','Ki','Ta'],
      ['Tu'], ['Na'],
      ['Kat'], ['Ta'],
      ['Dha','Ge'], ['Ti','Ra','Ki','Ta'],
      ['Dhi'], ['Dha'],
    ]
  },
  jhaptaal: {
    name: 'Jhaptaal',
    matras: 10,
    vibhags: [2, 3, 2, 3],
    tali: [0, 2],
    khali: [1, 3],
    theka: [
      ['Dhi'], ['Na'],
      ['Dhi','Dhi'], ['Na'], ['Ti','Na'],
      ['Dhi'], ['Dhi'],
      ['Dhi','Ge'], ['Na'], ['Ti','Na'],
    ]
  },
  rupak: {
    name: 'Rupak',
    matras: 7,
    vibhags: [3, 2, 2],
    tali: [1, 2],
    khali: [0],
    theka: [
      ['Ti'], ['Ti'], ['Na'],
      ['Dhi'], ['Na'],
      ['Dhi'], ['Na'],
    ]
  },
  dadra: {
    name: 'Dadra',
    matras: 6,
    vibhags: [3, 3],
    tali: [0],
    khali: [1],
    theka: [
      ['Dha'], ['Dhi'], ['Na'],
      ['Dha'], ['Ti'], ['Na'],
    ]
  },
  keharwa: {
    name: 'Keharwa',
    matras: 8,
    vibhags: [4, 4],
    tali: [0],
    khali: [1],
    theka: [
      ['Dha'], ['Ge'], ['Na'], ['Ti'],
      ['Na'], ['Ka'], ['Dhi'], ['Na'],
    ]
  },
};

// ── State ─────────────────────────────────────────────
let currentTala = 'teental';
let isPlaying = false;
let currentBeat = 0;
let cycleCount = 0;

// ── Tone.js synths ────────────────────────────────────
const bass = new Tone.MembraneSynth({
  pitchDecay: 0.02,
  octaves: 4,
  oscillator: { type: 'sine' },
  envelope: { attack: 0.001, decay: 0.15, sustain: 0, release: 0.05 }
});

const sharp = new Tone.MetalSynth({
  frequency: 200,
  harmonicity: 3.1,
  modulationIndex: 16,
  resonance: 800,
  octaves: 1,
  envelope: { attack: 0.001, decay: 0.12, release: 0.01 }
});

const click = new Tone.NoiseSynth({
  noise: { type: 'white' },
  envelope: { attack: 0.001, decay: 0.025, sustain: 0 }
});

// Master volume
const masterVol = new Tone.Volume(-8).toDestination();
bass.connect(masterVol);
sharp.connect(masterVol);
click.connect(masterVol);

let loop = null;

// ── Sound mapping ─────────────────────────────────────
function playBol(bol, time, durSeconds) {
  const d = Math.min(durSeconds, 0.25);

  switch (bol) {
    case 'Dha':
      bass.triggerAttackRelease('C2', d * 1.1, time);
      sharp.triggerAttackRelease('C5', d * 0.4, time);
      break;
    case 'Dhin':
      bass.triggerAttackRelease('D2', d * 0.9, time);
      sharp.triggerAttackRelease('D5', d * 0.35, time);
      break;
    case 'Dhi':
      sharp.triggerAttackRelease('A5', d * 0.5, time);
      bass.triggerAttackRelease('D#2', d * 0.4, time);
      break;
    case 'Ta':
      sharp.triggerAttackRelease('E5', d * 0.45, time);
      break;
    case 'Tin':
      sharp.triggerAttackRelease('F#5', d * 0.5, time);
      break;
    case 'Ti':
      sharp.triggerAttackRelease('G5', d * 0.35, time);
      break;
    case 'Na':
      sharp.triggerAttackRelease('G#5', d * 0.55, time);
      break;
    case 'Ge':
      bass.triggerAttackRelease('G1', d * 0.5, time);
      break;
    case 'Ghe':
      bass.triggerAttackRelease('F#1', d * 0.5, time);
      break;
    case 'Kat':
    case 'Ka':
      click.triggerAttackRelease(d * 0.12, time);
      break;
    case 'Tu':
      click.triggerAttackRelease(d * 0.15, time);
      break;
    case 'Ra':
    case 'Ki':
      sharp.triggerAttackRelease('B5', d * 0.2, time);
      break;
    default:
      click.triggerAttackRelease(d * 0.1, time);
  }
}

function playBeat(bols, time, beatDuration, isSam) {
  const n = bols.length;
  const subDur = beatDuration / n;

  bols.forEach((bol, i) => {
    const t = time + (i * subDur);
    const d = subDur;
    if (isSam && i === 0) {
      // Sam emphasis: louder, fuller
      playBol(bol, t, d * 1.4);
      bass.triggerAttackRelease('C1', d * 1.5, t);
    } else {
      playBol(bol, t, d);
    }
  });
}

// ── UI helpers ────────────────────────────────────────
function buildMarkers(tala) {
  const markers = [];
  let bi = 0;
  tala.vibhags.forEach((vBeats, vi) => {
    for (let i = 0; i < vBeats; i++) {
      markers.push({
        isVibhagStart: i === 0,
        isTali: tala.tali.includes(vi),
        isKhali: tala.khali.includes(vi),
      });
      bi++;
    }
  });
  return markers;
}

function renderTheka() {
  const tala = TALAS[currentTala];
  const markers = buildMarkers(tala);
  const grid = document.getElementById('thekaGrid');
  const beats = tala.theka;

  document.getElementById('thekaName').textContent = tala.name;
  document.getElementById('matraCount').textContent = ` · ${tala.matras} matras`;

  grid.innerHTML = '';
  let beatIdx = 0;

  tala.vibhags.forEach((vBeats, vi) => {
    const group = document.createElement('div');
    group.className = 'vibhag-group';

    for (let i = 0; i < vBeats; i++) {
      const cell = document.createElement('div');
      cell.className = 'beat-cell';
      cell.dataset.beat = beatIdx;

      const bols = beats[beatIdx];
      const m = markers[beatIdx];

      // Determine cell class
      if (beatIdx === 0) {
        cell.classList.add('sam');
      } else if (m.isVibhagStart && m.isTali) {
        cell.classList.add('tali-start');
      } else if (m.isVibhagStart && m.isKhali) {
        cell.classList.add('khali-start');
      }

      // Marker label
      if (beatIdx === 0) {
        const badge = document.createElement('span');
        badge.className = 'beat-marker';
        badge.textContent = 'SAM';
        cell.appendChild(badge);
      } else if (m.isVibhagStart && m.isTali) {
        const badge = document.createElement('span');
        badge.className = 'beat-marker';
        badge.textContent = '✋';
        cell.appendChild(badge);
      } else if (m.isVibhagStart && m.isKhali) {
        const badge = document.createElement('span');
        badge.className = 'beat-marker';
        badge.textContent = '🌊';
        cell.appendChild(badge);
      }

      // Bol text
      if (bols.length === 1) {
        const bolSpan = document.createElement('span');
        bolSpan.className = 'bol';
        bolSpan.textContent = bols[0];
        cell.appendChild(bolSpan);
      } else {
        const bolSpan = document.createElement('span');
        bolSpan.className = 'bol';
        bolSpan.textContent = bols.slice(0, 2).join('');
        cell.appendChild(bolSpan);
        if (bols.length > 2) {
          const subSpan = document.createElement('span');
          subSpan.className = 'sub-bol';
          subSpan.textContent = bols.slice(2).join('');
          cell.appendChild(subSpan);
        }
      }

      group.appendChild(cell);
      beatIdx++;
    }

    grid.appendChild(group);
  });

  // Reset highlight
  highlightBeat(-1);
}

function highlightBeat(beatIdx) {
  document.querySelectorAll('.beat-cell').forEach((cell, i) => {
    if (i === beatIdx) {
      cell.classList.add('active');
    } else {
      cell.classList.remove('active');
    }
  });
}

// ── Playback ──────────────────────────────────────────
function startPlayback() {
  if (isPlaying) return;

  const tala = TALAS[currentTala];
  const tempo = parseInt(document.getElementById('tempoSlider').value);

  // Resume audio context (browser autoplay policy)
  Tone.start().then(() => {
    Tone.Transport.bpm.value = tempo;
    currentBeat = 0;
    cycleCount = 0;

    if (loop) loop.dispose();

    loop = new Tone.Loop((time) => {
      const beatDuration = Tone.Time('4n').toSeconds();
      const beatIdx = currentBeat;
      if (beatIdx < 0 || beatIdx >= tala.theka.length) return;

      const bols = tala.theka[beatIdx];
      const isSam = (beatIdx === 0);

      // Play sound
      playBeat(bols, time, beatDuration, isSam);

      // Update state for next iteration
      currentBeat = (beatIdx + 1) % tala.matras;
      if (currentBeat === 0) cycleCount++;

      // Update UI (with captured beatIdx to avoid race)
      Tone.Draw.schedule(() => {
        highlightBeat(beatIdx);
        document.getElementById('cycleCounter').textContent =
          `Cycle ${cycleCount} · Beat ${beatIdx + 1}/${tala.matras}`;
      }, time);

    }, '4n');

    loop.start(0);
    Tone.Transport.position = 0;
    Tone.Transport.start();

    isPlaying = true;
    updateButtons();
  });
}

function stopPlayback() {
  Tone.Transport.stop();
  Tone.Transport.cancel(0);
  Tone.Transport.position = 0;
  if (loop) loop.dispose();
  loop = null;
  currentBeat = 0;
  cycleCount = 0;
  isPlaying = false;

  highlightBeat(-1);
  document.getElementById('cycleCounter').textContent = 'Stopped';
  updateButtons();
}

function updateButtons() {
  document.getElementById('btnPlay').disabled = isPlaying;
  document.getElementById('btnStop').disabled = !isPlaying;
}

// ── Event handlers ────────────────────────────────────
function selectTala(key) {
  if (isPlaying) stopPlayback();
  currentTala = key;
  document.querySelectorAll('.tala-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-tala="${key}"]`).classList.add('active');
  renderTheka();
}

function setTempo(val) {
  document.getElementById('tempoValue').textContent = val;
  if (isPlaying) {
    Tone.Transport.bpm.value = val;
  }
}

// ── Init ──────────────────────────────────────────────
function init() {
  // Build tala buttons
  const selector = document.getElementById('talaSelector');
  Object.entries(TALAS).forEach(([key, tala]) => {
    const btn = document.createElement('button');
    btn.className = 'tala-btn';
    btn.dataset.tala = key;
    btn.textContent = tala.name;
    btn.addEventListener('click', () => selectTala(key));
    selector.appendChild(btn);
  });

  // Tempo slider
  const slider = document.getElementById('tempoSlider');
  slider.addEventListener('input', (e) => setTempo(e.target.value));

  // Buttons
  document.getElementById('btnPlay').addEventListener('click', startPlayback);
  document.getElementById('btnStop').addEventListener('click', stopPlayback);

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      isPlaying ? stopPlayback() : startPlayback();
    }
  });

  // Initial render
  selectTala('teental');
  setTempo(120);
}

init();
</script>
</body>
</html>
